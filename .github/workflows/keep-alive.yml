name: Keep Render awake

# Render's free tier spins the service down after ~15 min idle, so the first
# request afterwards eats a 30-60s cold start. This pings the backend every
# ~10 min to keep it warm (and keeps the Supabase pooler active too).
# Public-repo Actions minutes are free. Cron fires in UTC and GitHub may delay
# scheduled runs a few minutes under load — 10 min leaves margin under the 15.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          URL="https://eg-music.onrender.com/api/tracks?limit=1"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL") || code=000
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "backend did not return 200 after 3 attempts"
          exit 1
