services:
  - type: web
    name: eg-music
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/tracks?limit=1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: egmusic
      # Public R2 CDN URL (r2.dev) — not secret. Media is served through
      # Cloudflare's edge instead of the slow S3 API endpoint.
      - key: R2_PUBLIC_URL
        value: https://pub-a61e6b9393a8413ea0770ea0abf172bb.r2.dev
